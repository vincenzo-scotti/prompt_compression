# ICSE'26 — Full Benchmark Suite — google/gemma-4-26B-A4B-it (4-bit NF4, self-hosted)
#
# Gemma 4 26B-A4B is a Mixture-of-Experts instruction-tuned model
# (26B total params, ~4B active per token).  4-bit NF4 quantization keeps
# peak VRAM under ~20 GB.
#
# Chat template: required for Gemma instruction-tuned ("-it") variants.
# Few-shot formatting: fewshot_as_multiturn=true formats demonstrations as
# separate (user, assistant) turns — the recommended setup for chat models.
# Stop sequence: Gemma uses <end_of_turn> as end-of-turn token.
#
# Task-specific settings (num_fewshot, compress_field, generation_kwargs,
# instruction_prefix) are defined in tasks.yaml and merged automatically.
#
# Tasks (5 benchmarks — identical to GPT config):
#   mbpp_instruct, mmlu_pro_computer_science, gsm8k_cot,
#   bbh_cot_fewshot_logical_deduction_seven_objects,
#   leaderboard_musr_murder_mysteries
#
# mbpp_instruct requires: HF_ALLOW_CODE_EVAL=1

task_library: ./tasks.yaml

model:
  type: hf
  name: google/gemma-4-26B-A4B-it
  kwargs:
    batch_size: 4
    max_length: 8192
    device_map: auto
    dtype: bfloat16
    trust_remote_code: true
  quantization:
    load_in_4bit: true
    bnb_4bit_quant_type: nf4
    bnb_4bit_compute_dtype: bfloat16
    bnb_4bit_use_double_quant: true

output:
  dir: ./results/icse_26/gemma-4-26b-a4b-it
  overwrite: false

defaults:
  # Gemma instruct models require the chat template.
  apply_chat_template: true
  fewshot_as_multiturn: true

  use_fitting: true
  use_llm_for_semantic: true

  n_search: 50
  n_test: 50
  algorithm: nsga2
  pop_size: 20
  n_gen: 15

  seed: 42
  subset_seed: 42

  baselines:
    - no_compression
    - all_transformations
    - random_search
    - multi_armed_bandit
    - summarization
    - truncated_prompt
    - random_deletion
    - llmlingua2

  # Gemma end-of-turn token — appended to the task's own stop list.
  extra_stop_sequences: ["<end_of_turn>"]

  search_transformation_ids:
    - O1
    - O2
    - O3
    - O4
    - O5
    - O6
    - O7
    - O8
    - O9
    - O10
    - O11
    - O12
    - O13
    - O14
    - O15
    - O16
    - O17
    - O18
    - O19
    - O20
    - O21
    - O22

  metric_key: null


# ── Transferability analysis ────────────────────────────────────────────────
transferability:
  enabled: true
  pairs:
    - [gsm8k_cot_nsga2, bbh_logical_deduction_nsga2]
    - [bbh_logical_deduction_nsga2, gsm8k_cot_nsga2]


runs:

  # ═══════════════════════════════════════════════ MBPP-Instruct ══════════════
  - name: mbpp_instruct_nsga2
    task: mbpp_instruct
    algorithm: nsga2

a  # ═══════════════════════════════════════════════ MMLU-Pro (CS) ══════════════
  - name: mmlu_pro_cs_nsga2
    task: mmlu_pro_computer_science
    algorithm: nsga2

  # ═══════════════════════════════════════════════ GSM8K-CoT ══════════════════
  - name: gsm8k_cot_nsga2
    task: gsm8k_cot
    algorithm: nsga2

  # ═══════════════════════════════════════════════ BBH – Logical Deduction ════
  - name: bbh_logical_deduction_nsga2
    task: bbh_cot_fewshot_logical_deduction_seven_objects
    algorithm: nsga2

  # ═══════════════════════════════════════════════ MuSR – Murder Mysteries ════
  - name: musr_murder_mysteries_nsga2
    task: leaderboard_musr_murder_mysteries
    algorithm: nsga2