# ICSE'26 — Full Benchmark Suite — gemma4-26b-a4b-it served by llama.cpp via llama-swap
#
# Server: llama-swap; its URL is read from LLAMA_CPP_BASE_URL and the API key
# from LLAMA_CPP_API_KEY (both in .env, never in this file).  Requests go to the
# OpenAI-compatible endpoint /v1/chat/completions; llama-swap selects the model
# from the `name` below, which must match its model id.
# The server applies the model's chat template; the whole prompt is sent as one
# user turn.  Token counts come from the model's own /tokenize endpoint.
# Thinking: disabled on every request (chat_template_kwargs.enable_thinking=false).
# Tasks: mbpp_instruct, mmlu_pro_computer_science, gsm8k_cot,
#   bbh_cot_fewshot_logical_deduction_seven_objects (task settings in tasks.yaml).
# mbpp_instruct requires: HF_ALLOW_CODE_EVAL=1

task_library: ./tasks.yaml

model:
  type: llama-cpp
  name: gemma4-26b-a4b-it
  kwargs:
    # Server URL: LLAMA_CPP_BASE_URL in .env (e.g. http://141.3.52.248:9292);
    # a base_url here would take precedence.
    llama_swap: true
    disable_thinking: true
    num_concurrent: 4        # adjust to the server's --parallel slots
    timeout: 900             # seconds per request (lm-eval default 300)
    max_retries: 10          # lm-eval default 3

output:
  dir: ./results/icse_26_final/gemma4-26b-a4b-it
  overwrite: false

defaults:
  apply_chat_template: false   # the llama.cpp server applies the chat template
  fewshot_as_multiturn: false  # true is not supported (see header)

  use_fitting: true
  use_llm_for_semantic: true

  n_search: 50
  n_test: 50
  algorithm: nsga2
  pop_size: 20
  n_gen: 15

  seed: 42
  subset_seed: 42

  baselines:
    - no_compression
    - all_transformations
    - random_search
    - multi_armed_bandit
    - summarization
    - truncated_prompt
    - random_deletion
    - llmlingua2

  # Gemma end-of-turn token — appended to the task's own stop list.
  extra_stop_sequences: null   # the server stops at end-of-turn

  search_transformation_ids:
    - O1
    - O2
    - O3
    - O4
    - O5
    - O6
    - O7
    - O8
    - O9
    - O10
    - O11
    - O12
    - O13
    - O14
    - O15
    - O16
    - O17
    - O18
    - O19
    - O20
    - O21
    - O22

  metric_key: null


# ── Transferability analysis ────────────────────────────────────────────────
transferability:
  enabled: true
  pairs:
    - [gsm8k_cot_nsga2, bbh_logical_deduction_nsga2]
    - [bbh_logical_deduction_nsga2, gsm8k_cot_nsga2]


runs:

  # ═══════════════════════════════════════════════ MBPP-Instruct ══════════════
  - name: mbpp_instruct_nsga2
    task: mbpp_instruct
    algorithm: nsga2

 # ═══════════════════════════════════════════════ MMLU-Pro (CS) ══════════════
  - name: mmlu_pro_cs_nsga2
    task: mmlu_pro_computer_science
    algorithm: nsga2

  # ═══════════════════════════════════════════════ GSM8K-CoT ══════════════════
  - name: gsm8k_cot_nsga2
    task: gsm8k_cot
    algorithm: nsga2

  # ═══════════════════════════════════════════════ BBH – Logical Deduction ════
  - name: bbh_logical_deduction_nsga2
    task: bbh_cot_fewshot_logical_deduction_seven_objects
    algorithm: nsga2
