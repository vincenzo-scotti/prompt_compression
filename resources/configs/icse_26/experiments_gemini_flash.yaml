# ICSE'26 — Full Benchmark Suite — gemini-3-flash-preview (Google Gemini API)
#
# Mirrors experiments_gpt.yaml for the Gemini Flash model.
# The Gemini backend handles chat formatting internally; apply_chat_template
# and fewshot_as_multiturn must be false (same pattern as OpenAI chat models).
#
# Task-specific settings (num_fewshot, compress_field, generation_kwargs,
# instruction_prefix) are defined in tasks.yaml and merged automatically.
#
# Tasks (5 benchmarks — identical to GPT config):
#   mbpp_instruct, mmlu_pro_computer_science, gsm8k_cot,
#   bbh_cot_fewshot_logical_deduction_seven_objects,
#   leaderboard_musr_murder_mysteries
#
# Requires: GOOGLE_API_KEY (or GEMINI_API_KEY, whichever the backend expects)
# mbpp_instruct also requires: HF_ALLOW_CODE_EVAL=1

task_library: ./tasks.yaml

model:
  type: gemini
  name: gemini-3-flash-preview
  kwargs:
    # Gemini supports concurrent requests; 4 is a safe default for Flash.
    num_concurrent: 4
    # Disable internal chain-of-thought to reduce latency. Sets thinking_budget=0
    # on the OpenAI-compatible endpoint; max_tokens then reflects visible output only.
    disable_thinking: true

output:
  dir: ./results/icse_26/gemini-3-flash-preview
  overwrite: false

defaults:
  # Gemini API manages chat formatting; disable lm-eval template application.
  apply_chat_template: false
  fewshot_as_multiturn: false

  use_fitting: true
  use_llm_for_semantic: true

  n_search: 50
  n_test: 50
  algorithm: nsga2
  pop_size: 20
  n_gen: 15

  seed: 42
  subset_seed: 42

  baselines:
    - no_compression
    - all_transformations
    - random_search
    - multi_armed_bandit
    - summarization
    - truncated_prompt
    - random_deletion
    - llmlingua2

  extra_stop_sequences: null
  search_transformation_ids:
    - O1
    - O2
    - O3
    - O4
    - O5
    - O6
    - O7
    - O8
    - O9
    - O10
    - O11
    - O12
    - O13
    - O14
    - O15
    - O16
    - O17
    - O18
    - O19
    - O20
    - O21
    - O22

  metric_key: null


# ── Transferability analysis ────────────────────────────────────────────────
transferability:
  enabled: true
  pairs:
    - [gsm8k_cot_nsga2, bbh_logical_deduction_nsga2]
    - [bbh_logical_deduction_nsga2, gsm8k_cot_nsga2]


runs:

  # ═══════════════════════════════════════════════ MBPP-Instruct ══════════════
  - name: mbpp_instruct_nsga2
    task: mbpp_instruct
    algorithm: nsga2

  # ═══════════════════════════════════════════════ MMLU-Pro (CS) ══════════════
  - name: mmlu_pro_cs_nsga2
    task: mmlu_pro_computer_science
    algorithm: nsga2

  # ═══════════════════════════════════════════════ GSM8K-CoT ══════════════════
  - name: gsm8k_cot_nsga2
    task: gsm8k_cot
    algorithm: nsga2

  # ═══════════════════════════════════════════════ BBH – Logical Deduction ════
  - name: bbh_logical_deduction_nsga2
    task: bbh_cot_fewshot_logical_deduction_seven_objects
    algorithm: nsga2

  # MuSR (leaderboard_musr_murder_mysteries) is a loglikelihood task and is not
  # supported by chat API models — omitted for Gemini.