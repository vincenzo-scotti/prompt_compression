# ICSE'26 — Full Benchmark Suite — Qwen/Qwen3.6-35B-A3B (4-bit NF4, self-hosted)
#
# Qwen3.6-35B-A3B is a Mixture-of-Experts model (35B total params, ~3B active
# per token), which makes it memory-efficient relative to dense models of
# comparable capability.  4-bit NF4 quantization keeps peak VRAM under ~20 GB.
#
# Chat template: required for Qwen3 instruction-tuned models.
# Few-shot formatting: fewshot_as_multiturn=true encodes each demonstration as
# a separate (user, assistant) turn — the recommended setup for chat-tuned models.
# Stop sequence: Qwen3 uses <|im_end|> as end-of-turn token.
#
# Tasks (5 benchmarks — identical to GPT config):
#   mbpp_instruct, mmlu_pro_computer_science, gsm8k_cot,
#   bbh_cot_fewshot_logical_deduction_seven_objects,
#   leaderboard_musr_murder_mysteries
#
# mbpp_instruct requires: HF_ALLOW_CODE_EVAL=1

model:
  type: hf
  name: Qwen/Qwen3.6-35B-A3B
  kwargs:
    # MoE models can sustain larger batch sizes than dense models of similar
    # active-parameter count; start with 4 and increase if VRAM allows.
    batch_size: 4
    max_length: 8192        # Qwen3 supports up to 128 K; cap for eval speed
    device_map: auto
    dtype: bfloat16
    trust_remote_code: true
  quantization:
    load_in_4bit: true
    bnb_4bit_quant_type: nf4
    bnb_4bit_compute_dtype: bfloat16
    bnb_4bit_use_double_quant: true

output:
  dir: ./results/icse_26/qwen3.6-35b-a3b
  overwrite: false

defaults:
  compress_field: prompt_0shot

  # Qwen3 is an instruct model; apply the chat template and format few-shot
  # examples as multi-turn conversation turns.
  apply_chat_template: true
  fewshot_as_multiturn: true

  use_fitting: true
  use_llm_for_semantic: true

  n_search: 20
  n_test: 50
  algorithm: nsga2
  pop_size: 50
  n_gen: 10

  seed: 42
  subset_seed: 42

  baselines:
    - no_compression
    - all_transformations
    - random_search
    - summarization
    - truncated_prompt
    - random_deletion

  # Qwen3 end-of-turn token — appended to the task's own stop list.
  extra_stop_sequences: ["<|im_end|>"]

  metric_key: null
  search_split: test
  test_split: test


# ── Transferability analysis ────────────────────────────────────────────────
transferability:
  enabled: true
  pairs:
    - [gsm8k_cot_nsga2, bbh_logical_deduction_nsga2]
    - [bbh_logical_deduction_nsga2, gsm8k_cot_nsga2]


runs:

  # ═══════════════════════════════════════════════ MBPP-Instruct ══════════════
  - name: mbpp_instruct_nsga2
    task: mbpp_instruct
    algorithm: nsga2
    num_fewshot: 3
    compress_field: prompt_0shot
    search_split: test
    test_split: test
    generation_kwargs:
      max_gen_toks: 256

  - name: mbpp_instruct_mab
    task: mbpp_instruct
    algorithm: mab
    num_fewshot: 3
    compress_field: prompt_0shot
    search_split: test
    test_split: test
    generation_kwargs:
      max_gen_toks: 256
    baselines:
      - no_compression
      - all_transformations
      - random_search
      - summarization
      - truncated_prompt
      - random_deletion

  # ═══════════════════════════════════════════════ MMLU-Pro (CS) ══════════════
  - name: mmlu_pro_cs_nsga2
    task: mmlu_pro_computer_science
    algorithm: nsga2
    num_fewshot: 5
    compress_field: prompt_0shot
    search_split: test
    test_split: test
    generation_kwargs:
      max_gen_toks: 1024

  - name: mmlu_pro_cs_mab
    task: mmlu_pro_computer_science
    algorithm: mab
    num_fewshot: 5
    compress_field: prompt_0shot
    search_split: test
    test_split: test
    generation_kwargs:
      max_gen_toks: 1024
    baselines:
      - no_compression
      - all_transformations
      - random_search
      - summarization
      - truncated_prompt
      - random_deletion

  # ═══════════════════════════════════════════════ GSM8K-CoT ══════════════════
  # metric_key: flexible-extract — handles paraphrased numeric answers.
  - name: gsm8k_cot_nsga2
    task: gsm8k_cot
    algorithm: nsga2
    num_fewshot: 8
    metric_key: null
    compress_field: prompt_0shot
    search_split: test
    test_split: test
    generation_kwargs:
      max_gen_toks: 1024

  - name: gsm8k_cot_mab
    task: gsm8k_cot
    algorithm: mab
    num_fewshot: 8
    metric_key: null
    compress_field: prompt_0shot
    search_split: test
    test_split: test
    generation_kwargs:
      max_gen_toks: 1024
    baselines:
      - no_compression
      - all_transformations
      - random_search
      - summarization
      - truncated_prompt
      - random_deletion

  # ═══════════════════════════════════════════════ BBH – Logical Deduction ════
  - name: bbh_logical_deduction_nsga2
    task: bbh_cot_fewshot_logical_deduction_seven_objects
    algorithm: nsga2
    num_fewshot: 3
    compress_field: prompt_0shot
    search_split: test
    test_split: test
    generation_kwargs:
      max_gen_toks: 1024

  - name: bbh_logical_deduction_mab
    task: bbh_cot_fewshot_logical_deduction_seven_objects
    algorithm: mab
    num_fewshot: 3
    compress_field: prompt_0shot
    search_split: test
    test_split: test
    generation_kwargs:
      max_gen_toks: 1024
    baselines:
      - no_compression
      - all_transformations
      - random_search
      - summarization
      - truncated_prompt
      - random_deletion

  # ═══════════════════════════════════════════════ MuSR – Murder Mysteries ════
  - name: musr_murder_mysteries_nsga2
    task: leaderboard_musr_murder_mysteries
    algorithm: nsga2
    num_fewshot: 0
    compress_field: null
    search_split: test
    test_split: test

  - name: musr_murder_mysteries_mab
    task: leaderboard_musr_murder_mysteries
    algorithm: mab
    num_fewshot: 0
    compress_field: null
    search_split: test
    test_split: test
    baselines:
      - no_compression
      - all_transformations
      - random_search
      - summarization
      - truncated_prompt
      - random_deletion