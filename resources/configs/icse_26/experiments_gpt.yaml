# ICSE'26 — Full Benchmark Suite — gpt-5.4-mini-2026-03-17 (OpenAI Chat API)
#
# model_type: openai-chat  (NOT openai-chat-completions)
# The openai-chat type calls LocalChatCompletion._create_payload directly,
# bypassing the lm-eval o-series heuristic that checks "5" in model_name.
# Without this, gpt-5.4-mini-2026-03-17 would have stop sequences stripped
# and temperature forced to 1.
#
# Semantic operators (O23–O28): a universal guardrail in Transformation.__call__
# reverts any operator that expands or empties the text, so operators can only
# compress or be neutral, never expand.
#
# Task-specific settings (num_fewshot, compress_field, generation_kwargs)
# are defined in tasks.yaml and merged automatically.
#
# Tasks (5 benchmarks):
#   mbpp_instruct                                  — code gen, pass@1, 3-shot
#   mmlu_pro_computer_science                      — CS knowledge, acc, 5-shot CoT
#   gsm8k_cot                                      — math reasoning, 8-shot CoT
#   bbh_cot_fewshot_logical_deduction_seven_objects — reasoning, exact match, 3-shot
#   leaderboard_musr_murder_mysteries              — multi-step reasoning, acc_norm, 0-shot
#
# Each task runs twice: NSGA-II (primary) and MAB (Thompson Sampling).
# Requires: OPENAI_API_KEY

task_library: ./tasks.yaml

model:
  type: openai-chat
  name: gpt-5.4-mini-2026-03-17
  kwargs:
    # gpt-5.4-mini does not support the 'stop' parameter.
    drop_stop_sequences: true
    # Run four API requests in parallel to reduce wall-clock time.
    num_concurrent: 4

output:
  dir: ./results/icse_26/gpt-5.4-mini-2026-03-17
  overwrite: false

defaults:
  apply_chat_template: false
  fewshot_as_multiturn: false

  use_fitting: true
  use_llm_for_semantic: true

  n_search: 50
  n_test: 50
  algorithm: nsga2
  pop_size: 20
  n_gen: 15

  seed: 42
  subset_seed: 42

  baselines:
    - no_compression
    - all_transformations
    - random_search
    - multi_armed_bandit
    - summarization
    - truncated_prompt
    - random_deletion
    - llmlingua2

  extra_stop_sequences: null
  search_transformation_ids:
    - O1
    - O2
    - O3
    - O4
    - O5
    - O6
    - O7
    - O8
    - O9
    - O10
    - O11
    - O12
    - O13
    - O14
    - O15
    - O16
    - O17
    - O18
    - O19
    - O20
    - O21
    - O22

  metric_key: null


# ── Transferability analysis ────────────────────────────────────────────────
transferability:
  enabled: true
  pairs:
    - [gsm8k_cot_nsga2, bbh_logical_deduction_nsga2]
    - [bbh_logical_deduction_nsga2, gsm8k_cot_nsga2]


runs:

  # ═══════════════════════════════════════════════ MBPP-Instruct ══════════════
  # Task settings (num_fewshot, compress_field, generation_kwargs)
  # come from tasks.yaml.
  # Requires: HF_ALLOW_CODE_EVAL=1
  - name: mbpp_instruct_nsga2
    task: mbpp_instruct
    algorithm: nsga2

  # ═══════════════════════════════════════════════ MMLU-Pro (CS) ══════════════
  - name: mmlu_pro_cs_nsga2
    task: mmlu_pro_computer_science
    algorithm: nsga2

  # ═══════════════════════════════════════════════ GSM8K-CoT ══════════════════
  - name: gsm8k_cot_nsga2
    task: gsm8k_cot
    algorithm: nsga2

  # ═══════════════════════════════════════════════ BBH – Logical Deduction ════
  - name: bbh_logical_deduction_nsga2
    task: bbh_cot_fewshot_logical_deduction_seven_objects
    algorithm: nsga2

  # MuSR (leaderboard_musr_murder_mysteries) is a loglikelihood task and is not
  # supported by chat API models — omitted for GPT.