# ICSE'26 — Full Benchmark Suite — Qwen/Qwen3.5-9B (4-bit NF4, self-hosted)
#
# Qwen3.5-9B is a dense 9B-parameter model. 4-bit NF4 quantization keeps
# peak VRAM under ~6 GB, allowing larger batch sizes than the MoE variants.
#
# Chat template: required for Qwen3 instruction-tuned models.
# Few-shot formatting: fewshot_as_multiturn=true encodes each demonstration as
# a separate (user, assistant) turn — the recommended setup for chat-tuned models.
# Stop sequence: Qwen3 uses <|im_end|> as end-of-turn token.
#
# Task-specific settings (num_fewshot, compress_field, generation_kwargs,
# instruction_prefix) are defined in tasks.yaml and merged automatically.
#
# Tasks (5 benchmarks — identical to other model configs):
#   mbpp_instruct, mmlu_pro_computer_science, gsm8k_cot,
#   bbh_cot_fewshot_logical_deduction_seven_objects,
#   leaderboard_musr_murder_mysteries
#
# mbpp_instruct requires: HF_ALLOW_CODE_EVAL=1

task_library: ./tasks.yaml

model:
  type: hf
  name: Qwen/Qwen3.5-9B
  kwargs:
    # 9B dense model at 4-bit fits comfortably in ~6 GB VRAM; batch_size=8
    # is safe and keeps GPU utilisation high during evaluation.
    batch_size: 8
    max_length: 8192
    device_map: auto
    dtype: bfloat16
    trust_remote_code: true
  quantization:
    load_in_4bit: true
    bnb_4bit_quant_type: nf4
    bnb_4bit_compute_dtype: bfloat16
    bnb_4bit_use_double_quant: true

output:
  dir: ./results/icse_26/qwen3.5-9b
  overwrite: false

defaults:
  # Qwen3 is an instruct model; apply the chat template and format few-shot
  # examples as multi-turn conversation turns.
  apply_chat_template: true
  fewshot_as_multiturn: true

  use_fitting: true
  use_llm_for_semantic: true

  n_search: 20
  n_test: 50
  algorithm: nsga2
  pop_size: 50
  n_gen: 10

  seed: 42
  subset_seed: 42

  baselines:
    - no_compression
    - all_transformations
    - random_search
    - summarization
    - truncated_prompt
    - random_deletion
    - llmlingua2

  # Qwen3 end-of-turn token — appended to the task's own stop list.
  extra_stop_sequences: ["<|im_end|>"]

  metric_key: null


# ── Transferability analysis ────────────────────────────────────────────────
transferability:
  enabled: true
  pairs:
    - [gsm8k_cot_nsga2, bbh_logical_deduction_nsga2]
    - [bbh_logical_deduction_nsga2, gsm8k_cot_nsga2]


runs:

  # ═══════════════════════════════════════════════ MBPP-Instruct ══════════════
  - name: mbpp_instruct_nsga2
    task: mbpp_instruct
    algorithm: nsga2

  - name: mbpp_instruct_mab
    task: mbpp_instruct
    algorithm: mab

  # ═══════════════════════════════════════════════ MMLU-Pro (CS) ══════════════
  - name: mmlu_pro_cs_nsga2
    task: mmlu_pro_computer_science
    algorithm: nsga2

  - name: mmlu_pro_cs_mab
    task: mmlu_pro_computer_science
    algorithm: mab

  # ═══════════════════════════════════════════════ GSM8K-CoT ══════════════════
  - name: gsm8k_cot_nsga2
    task: gsm8k_cot
    algorithm: nsga2

  - name: gsm8k_cot_mab
    task: gsm8k_cot
    algorithm: mab

  # ═══════════════════════════════════════════════ BBH – Logical Deduction ════
  - name: bbh_logical_deduction_nsga2
    task: bbh_cot_fewshot_logical_deduction_seven_objects
    algorithm: nsga2

  - name: bbh_logical_deduction_mab
    task: bbh_cot_fewshot_logical_deduction_seven_objects
    algorithm: mab

  # ═══════════════════════════════════════════════ MuSR – Murder Mysteries ════
  - name: musr_murder_mysteries_nsga2
    task: leaderboard_musr_murder_mysteries
    algorithm: nsga2

  - name: musr_murder_mysteries_mab
    task: leaderboard_musr_murder_mysteries
    algorithm: mab
